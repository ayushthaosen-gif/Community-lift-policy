name: Deploy lift simulation to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        shell: bash
        run: |
          set +e
          npm run build
          build_status=$?
          set -e
          if [ ! -f dist/client/index.html ]; then
            echo "Static export was not created."
            exit "$build_status"
          fi
          touch dist/client/.nojekyll
          echo "Static export verified."
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
